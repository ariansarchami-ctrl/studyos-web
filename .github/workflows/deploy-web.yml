name: Study OS Web - Test and Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate web source and run unit tests
        run: npm run check && npm test
      - name: Write public Supabase configuration
        env:
          STUDYOS_SUPABASE_URL: ${{ secrets.STUDYOS_SUPABASE_URL }}
          STUDYOS_SUPABASE_ANON_KEY: ${{ secrets.STUDYOS_SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          config={'supabaseUrl':os.environ.get('STUDYOS_SUPABASE_URL',''), 'supabaseAnonKey':os.environ.get('STUDYOS_SUPABASE_ANON_KEY','')}
          with open('config.js','w',encoding='utf-8') as f:
              f.write('window.STUDYOS_CONFIG = '+json.dumps(config)+';\n')
          PY
      - name: Prepare minimal public site
        run: |
          mkdir -p dist
          cp index.html style.css config.js manifest.webmanifest sw.js dist/
          cp -r js assets dist/
      - name: Upload web files
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
